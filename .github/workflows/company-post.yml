name: Company LinkedIn Auto Poster

on:
  push:
    paths:
      - 'trigger_post.txt'
      - 'trigger_company.txt'
  schedule:
    - cron: '0 5 * * 1,2,3,4,5'    # Mon-Fri at 10:00 AM PKT (5:00 AM UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate but dont post)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post to LinkedIn
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES_TEST }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true && 'true' || 'false' }}
        run: |
          cd scripts
          python company/generate_company_post.py

      - name: Commit posted topics state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/company/posted_hashes.json
          git diff --staged --quiet || git commit -m "chore: update company posted topic state [skip ci]"
          git push origin main
