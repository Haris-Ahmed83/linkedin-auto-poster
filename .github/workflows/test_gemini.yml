name: Test Gemini Web API
on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install gemini-webapi
      - name: Run Test
        env:
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES_TEST }}
        run: python scripts/test_gemini_web.py
