name: LinkedIn Auto Poster

on:
  schedule:
    - cron: '0 4 * * 1,3,5'    # Mon, Wed, Fri at 9:00 AM PKT (4:00 AM UTC)
    - cron: '0 5 * * 2,4,6'    # Tue, Thu, Sat at 10:00 AM PKT (5:00 AM UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate but dont post)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Generate and post to LinkedIn
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_USER_URN: ${{ secrets.LINKEDIN_USER_URN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true && 'true' || 'false' }}
        run: |
          cd scripts
          python generate_post.py
